<!DOCTYPE html>
<html>
<head>
    <title>My Reviews</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lists.css') }}">
</head>

<body>

    <div class="lists-box">

        <h1>{{ user.nickname or user.username }}'s Reviews</h1>

        <button onclick="location.href='/'">← Home</button>
        <button onclick="location.href='/dashboard'">← Back to Dashboard</button>

        <hr>

        <!-- ========================= -->
        <!-- YOUR REVIEWS SECTION -->
        <!-- ========================= -->
        <h2>Your Reviews</h2>

        {% if reviews %}
            {% for review in reviews %}
                <div class="review-card">
                    <h3>{{ review.title }} — {{ review.rating }}/10</h3>
                    <p>{{ review.content }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>You haven't written any reviews yet.</p>
        {% endif %}

        <hr>

        <!-- ========================= -->
        <!-- SEARCH + FILTER SECTION -->
        <!-- ========================= -->
        <h2>Search & Filter All Reviews</h2>

        <form method="GET" action="/reviews" class="filters">

            <input type="text" name="search" placeholder="Search reviews...">

            <select name="rating">
                <option value="">Filter by Rating</option>
                {% for i in range(0, 11) %}
                    <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>

            <input type="text" name="user" placeholder="Filter by user...">
        </form>

        <hr>

        <!-- ========================= -->
        <!-- ALL REVIEWS SECTION -->
        <!-- ========================= -->
        <h2>All Reviews</h2>

        <div id="all-reviews-box">
            <script>
                function updateAllReviews() {
                    const search = document.querySelector("input[name='search']").value;
                    const rating = document.querySelector("select[name='rating']").value;
                    const user = document.querySelector("input[name='user']").value;

                    const url = `/api/reviews?search=${encodeURIComponent(search)}&rating=${encodeURIComponent(rating)}&user=${encodeURIComponent(user)}`;

                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            const box = document.getElementById("all-reviews-box");
                            box.innerHTML = "";

                            if (data.reviews.length === 0) {
                                box.innerHTML = "<p>No reviews found.</p>";
                                return;
                            }

                            data.reviews.forEach(r => {
                                const card = document.createElement("div");
                                card.className = "review-card";
                                card.innerHTML = `
                                    <h3>${r.title} — ${r.rating}/10</h3>
                                    <p>${r.content}</p>
                                    <p><em>— ${r.username}</em></p>
                                `;
                                box.appendChild(card);
                            });
                        });
                }

                // Trigger live updates
                document.querySelector("input[name='search']").addEventListener("input", updateAllReviews);
                document.querySelector("select[name='rating']").addEventListener("change", updateAllReviews);
                document.querySelector("input[name='user']").addEventListener("input", updateAllReviews);

                // Load all reviews on page load
                updateAllReviews();
            </script>

        </div>




    </div>

</body>
</html>

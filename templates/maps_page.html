<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taste Tracker Map</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Explore Food Spots Around Bathurst</h1>
    <div id="map"></div>

    <script>
        function initMap() {
            const bathurst = { lat: -33.419, lng: 149.577 }; // Bathurst coordinates
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13,
                center: bathurst,
            });

            // Example marker
            new google.maps.Marker({
                position: bathurst,
                map: map,
                title: "Bathurst Central",
            });
        }
    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>
</body>
</html>
